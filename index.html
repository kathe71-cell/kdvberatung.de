            {
              "@type": "Question",
              "name": "Gilt das Recht auf Kriegsdienstverweigerung auch nach Aussetzung der Wehrpflicht fort?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ja, uneingeschränkt. Artikel 4 Absatz 3 Satz 1 des Grundgesetzes bestimmt: „Niemand darf gegen sein Gewissen zum Kriegsdienst mit der Waffe gezwungen werden.“ Dieses Grundrecht ist zeitlos verankert."
              }
            },
            {
              "@type": "Question",
              "name": "Wann sollte der KDV-Antrag am besten gestellt werden?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Für Ungediente empfiehlt sich die Antragstellung, sobald der persönliche Gewissensentschluss feststeht. Aktive Soldatinnen und Soldaten reichen den Antrag ein, sobald im Dienst ein unlösbarer Gewissenskonflikt entsteht."
              }
            },
            {
              "@type": "Question",
              "name": "An welche Behörde wird der Antrag gerichtet und wer entscheidet darüber?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Antragsempfänger ist das BAPersBw – Wehrersatzbehörde – (Militärringstraße 1000, 50737 Köln). Aktive Soldaten richten den Antrag direkt an BAPersBw Köln mit Kopie an den Vorgesetzten. Die inhaltliche Prüfung und Entscheidung trifft das Bundesamt für Familie und zivilgesellschaftliche Aufgaben (BAFzA)."
              }
            },
            {
              "@type": "Question",
              "name": "Schützt die Antragstellung sofort und automatisch vor dem Dienst mit der Waffe?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ungediente Kriegsdienstverweigerer werden gemäß § 3 Abs. 2 Satz 1 KDVG von der Einberufung zum Grundwehrdienst bis zur unanfechtbaren Ablehnung oder Rücknahme ihres Antrags nicht einberufen. Für ungediente Antragsteller, die vor dem 1. Januar 2010 geboren sind, gelten die Sonderregelungen des § 13 KDVG. Wurde ein Bescheid erlassen und sind die Kriterien des § 13 Abs. 1 KDVG nicht erfüllt, hemmt die Antragstellung die Vollziehung nicht automatisch (§ 3 Abs. 2 Satz 2 KDVG); vorläufiger Rechtsschutz (§ 80 Abs. 5 VwGO) muss beim zuständigen Verwaltungsgericht beantragt werden."
              }
            },
            {
              "@type": "Question",
              "name": "Wie läuft das KDV-Verfahren für aktive Soldatinnen und Soldaten (SaZ / FWDL)?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Aktive Soldaten stellen ihren Antrag schriftlich direkt an die Wehrersatzbehörde (BAPersBw Köln) mit nachrichtlicher Kopie an ihren Disziplinarvorgesetzten zur Weiterleitung an das BAFzA."
              }
            },
            {
              "@type": "Question",
              "name": "Können auch ehemalige Soldaten und Reservisten noch den Kriegsdienst verweigern?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ja. Der Antrag wird von Reservisten direkt an die Wehrersatzbehörde (BAPersBw Köln) gerichtet und vom BAFzA entschieden."
              }
            },
            {
              "@type": "Question",
              "name": "Was muss eine Gewissensbegründung enthalten?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nach der Rechtsprechung des BVerfG muss die Begründung die persönliche, unbedingte Entscheidung gegen das Töten von Menschen im Kriegsdienst schlüssig darlegen."
              }
            },
            {
              "@type": "Question",
              "name": "Darf man Textbausteine oder KI-Generatoren für die Gewissensbegründung nutzen?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Hiervon wird abgeraten. Das BAFzA prüft die persönliche Glaubwürdigkeit; fremde Textbausteine oder KI-Formulierungen können zu Rückfragen oder Ablehnung führen."
              }
            },
            {
              "@type": "Question",
              "name": "Was passiert, wenn der KDV-Antrag abgelehnt wird?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Gegen einen ablehnenden Bescheid des BAFzA kann innerhalb der Rechtsbehelfsfrist (i. d. R. 1 Monat) Widerspruch eingelegt werden. Bei erneut ablehnendem Bescheid steht der Klageweg vor dem Verwaltungsgericht offen."
              }
            },
            {
              "@type": "Question",
              "name": "Was kostet das KDV-Verfahren bei den Behörden?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Das behördliche Antragsverfahren bei BAPersBw und BAFzA ist gesetzlich gebührenfrei. Auch die Erstberatung bei gemeinnützigen Fachstellen ist in der Regel kostenlos."
