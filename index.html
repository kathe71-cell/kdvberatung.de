              "@type": "Question",
              "name": "Gilt das Recht auf Kriegsdienstverweigerung auch nach Aussetzung der Wehrpflicht fort?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Ja, uneingeschränkt. Artikel 4 Absatz 3 Satz 1 des Grundgesetzes bestimmt: „Niemand darf gegen sein Gewissen zum Kriegsdienst mit der Waffe gezwungen werden.“ Dieses Grundrecht ist zeitlos verankert und nicht an das Bestehen oder Ruhen der allgemeinen Wehrpflicht gebunden."

              "@type": "Question",

              }
            },

              "@type": "Question",

              }
            },

              "@type": "Question",
              "name": "Was muss eine tragfähige Gewissensbegründung enthalten?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Nach ständiger Rechtsprechung des BVerfG muss die Begründung die persönliche, unbedingte Entscheidung gegen das Töten von Menschen im Kriegsdienst nachvollziehbar darlegen: Werdegang der Werte, Schlüsselerlebnisse, unbedingte Absage an das Töten und Ernsthaftigkeit."
              }
            },
            {
              "@type": "Question",
              "name": "Darf man Textbausteine oder KI-Generatoren für die Gewissensbegründung nutzen?",

                "@type": "Answer",

              }
            },
            {
              "@type": "Question",
              "name": "Was passiert, wenn der KDV-Antrag abgelehnt wird?",

                "@type": "Answer",
                "text": "Gegen einen ablehnenden Bescheid des BAPersBw kann innerhalb eines Monats nach Zustellung schriftlich Widerspruch eingelegt werden. Bei erneut ablehnendem Widerspruchsbescheid steht die Klage vor dem Verwaltungsgericht offen."
              }
            },

              "@type": "Question",
